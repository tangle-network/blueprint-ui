name: Publish NPM

on:
  push:
    tags:
      - 'blueprint-ui-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (must match package.json)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tangle-network/blueprint-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate publish target
        id: validate
        run: |
          PKG_NAME="@tangle-network/blueprint-ui"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED_VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" == blueprint-ui-v* ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#blueprint-ui-v}"
          fi

          if [ -z "${EXPECTED_VERSION}" ]; then
            echo "Unsupported trigger or tag format."
            exit 1
          fi

          if [ "${EXPECTED_VERSION}" != "${PKG_VERSION}" ]; then
            echo "Version mismatch: expected ${EXPECTED_VERSION}, package.json has ${PKG_VERSION}"
            exit 1
          fi

          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published."
            exit 1
          fi

          echo "version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
